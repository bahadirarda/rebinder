name: Feature request
description: Propose a scoped product, adapter, or format capability.
title: "feature: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What continuation workflow is currently blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options: [Canonical format, Codex adapter, Claude adapter, CLI, Validation, Redaction, Installer or release, Documentation]
    validations:
      required: true
  - type: textarea
    id: loss
    attributes:
      label: Compatibility and information loss
      description: Describe state that cannot be represented exactly.
