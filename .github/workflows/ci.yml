name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changeset-status:
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      github.event.pull_request.title != 'build(release): version packages'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Require release intent for user-visible changes
        run: bun x changeset status --since="origin/$BASE_REF"

  conventional-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate pull request title
        shell: bash
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull request titles must follow Conventional Commits."
            exit 1
          fi

  release-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:release
      - run: bun run check:docs
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - name: Validate Rust crate
        run: cargo fmt --all --check && cargo clippy --all-targets --all-features --locked -- -D warnings && cargo test --all-features --locked
      - name: Validate Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
      - name: Validate crates.io package
        run: cargo package --locked
      - name: Build release binary
        run: cargo build --release --locked

  unix-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - run: cargo build --locked
      - run: sh scripts/test-installer.sh

  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Exercise verified PowerShell installation and rollback
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
