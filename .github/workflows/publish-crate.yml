name: publish crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated calendar release tag, for example v0.20260817.0
        required: true
        type: string
      confirm:
        description: I understand crates.io versions are permanent
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/rebinder
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify annotated calendar tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v0\.[0-9]{8}\.(0|[1-9][0-9]*)$ ]]; then
            echo "Publication tag must use v0.YYYYMMDD.REVISION."
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Publication requires an annotated tag."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Validate synchronized version metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun run version:check
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - run: cargo test --all-features --locked && cargo package --locked
      - name: Publish crate if absent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "Missing CARGO_REGISTRY_TOKEN"; exit 1; }
          version="${RELEASE_TAG#v}"
          if curl --fail --silent --show-error \
            --header "User-Agent: rebinder-release-workflow" \
            "https://crates.io/api/v1/crates/rebinder/$version" >/dev/null; then
            echo "rebinder $version is already published."
          else
            cargo publish --locked
          fi
