[package]
name = "rebinder"
version = "0.20260818.10"
edition = "2024"
rust-version = "1.85"
description = "Cross-harness session continuity for coding agents"
authors = ["bahadirarda"]
license = "MIT"
repository = "https://github.com/bahadirarda/rebinder"
homepage = "https://bahadirarda.github.io/rebinder/"
readme = "README.md"
keywords = ["ai", "cli", "coding-agent", "session", "portability"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/integrations/**",
    "/schemas/**",
    "/tests/**",
    "/examples/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rebinder"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
directories = "6.0.0"
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
result_large_err = "allow"
too_many_lines = "allow"
